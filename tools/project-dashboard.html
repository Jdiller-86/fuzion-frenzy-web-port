<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>Project progress</title>
<style>
:root{font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;color:#1f2328;background:#f6f8fa}*{box-sizing:border-box}body{margin:0}header,main{max-width:1100px;margin:auto;padding:1.25rem}header{border-bottom:1px solid #d1d9e0;background:#fff}h1{font-size:1.7rem;margin:.15rem 0}.meta{color:#59636e;display:flex;flex-wrap:wrap;gap:.3rem 1.25rem}.count{font-size:1.2rem;font-weight:650;margin:.8rem 0 0}.count span{color:#59636e;font-size:.95rem;font-weight:400}.notice{padding:1rem;border:1px solid #d1d9e0;border-radius:8px;background:#fff;margin:1rem 0}.controls{display:flex;align-items:center;gap:.7rem;flex-wrap:wrap;margin:1rem 0}select{font:inherit;padding:.4rem .6rem;border:1px solid #8c959f;border-radius:6px;background:#fff;color:inherit}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:1rem}.card{background:#fff;border:1px solid #d1d9e0;border-radius:8px;padding:1rem}.card h2{font-size:1.15rem;margin:0}.row{display:flex;justify-content:space-between;align-items:center;gap:.5rem}.badge{border:1px solid #d1d9e0;border-radius:2em;padding:.05rem .55rem;font-size:.82rem;white-space:nowrap}.accepted{background:#dafbe1;border-color:#4ac26b}.detail{color:#59636e;margin:.4rem 0}.tasks{padding-left:1.2rem;margin:.6rem 0 0}.tasks li{margin:.35rem 0}.tasks small{color:#59636e}.tasks a,.deps a{margin-left:.25rem}a{color:#0969da}a:focus-visible,select:focus-visible{outline:3px solid #0969da;outline-offset:2px}.deps{border-top:1px solid #d8dee4;margin-top:.8rem;padding-top:.5rem}footer{max-width:1100px;margin:auto;padding:0 1.25rem 1.5rem;color:#59636e;font-size:.9rem}@media(prefers-reduced-motion:no-preference){a{transition:color .12s}}
</style>
</head>
<body>
<header><h1>Project progress</h1><div class="meta" id="meta"></div><p class="count" id="count"></p></header>
<main><p class="notice" id="message" role="status" aria-live="polite"></p><div id="content" hidden><div class="controls"><label for="filter">Show milestones</label><select id="filter"><option value="all">All statuses</option></select><span id="task-count"></span></div><section class="grid" id="milestones" aria-label="Milestones"></section></div><section id="browser-scope" class="notice" hidden><h2>M1 browser work order</h2><p>Reviewed scope and connection evidence; these rows are not additional forecast packages or native issue statuses.</p><ol id="browser-order"></ol><div id="browser-rows"></div></section></main>
<footer>Milestone acceptance is evidence-based. Task status is shown separately and does not determine acceptance.</footer>
<script type="application/json" id="project-data">__PROJECT_JSON__</script>
<script>
(()=>{'use strict';const repo='Jdiller-86/fuzion-frenzy-web-port',dataNode=document.getElementById('project-data'),message=document.getElementById('message'),content=document.getElementById('content'),meta=document.getElementById('meta'),count=document.getElementById('count'),filter=document.getElementById('filter'),cards=document.getElementById('milestones'),taskCount=document.getElementById('task-count');
const el=(tag,text,cls)=>{const n=document.createElement(tag);if(text!==undefined)n.textContent=String(text);if(cls)n.className=cls;return n};const safeUrl=(u,kind)=>{try{const x=new URL(u);if(x.origin!=='https://github.com'||x.username||x.password||x.search||x.hash)return null;const prefix='/'+repo+'/'+(kind==='issue'?'issues/':'commit/');if(!x.pathname.startsWith(prefix))return null;const id=x.pathname.slice(prefix.length);return (kind==='issue'?/^[0-9]+$/:/^[a-f0-9]{40}$/).test(id)?x.href:null}catch{return null}};const link=(url,label,kind)=>{const u=safeUrl(url,kind);if(!u)return null;const a=el('a',label);a.href=u;a.rel='noopener noreferrer';return a};
let d;try{d=JSON.parse(dataNode.textContent)}catch{message.textContent='Progress data is unavailable.';return}if(d?.browserWork){document.getElementById('browser-scope').hidden=false;const order=document.getElementById('browser-order'),rows=document.getElementById('browser-rows');for(const p of d.browserWork.priorities)order.append(el('li',p.title));for(const item of [...d.browserWork.items].sort((a,b)=>a.priority-b.priority||a.id.localeCompare(b.id))){const row=el('details'),summary=el('summary',item.id+': '+item.title+' · '+item.size+' · '+item.state);row.append(summary,el('p','Evidence: '+item.evidence),el('p',item.startingPoint),el('p','Completion check: '+item.completion));if(item.resolution)row.append(el('p',item.resolution));rows.append(row)}}
if(!d||d.available!==true||!Array.isArray(d.milestones)){message.textContent='No project snapshot is currently available.';return}message.textContent='Milestone acceptance reflects recorded evidence. Task closure is reported separately.';content.hidden=false;
meta.append(el('span',d.repository===repo?repo:repo));meta.append(el('span','Source: '+( /^[a-f0-9]{40}$/.test(d.sourceCommit||'')?d.sourceCommit.slice(0,12):'unknown')));const commit=link('https://github.com/'+repo+'/commit/'+(d.sourceCommit||''),'View commit','commit');if(commit)meta.append(commit);meta.append(el('span','Generated: '+(d.generatedAt||'unknown')));
const accepted=d.milestones.filter(m=>m.accepted===true).length;count.append(document.createTextNode(accepted+' of 5 milestones accepted '),el('span','· task completion is separate'));const statuses=[...new Set(d.milestones.map(m=>m.status).filter(Boolean))];for(const s of statuses){const o=el('option',s);o.value=s;filter.append(o)}

const render=()=>{cards.replaceChildren();let closed=0,total=0,packageTotal=0;for(const m of d.milestones){const tasks=Array.isArray(m.tasks)?m.tasks:[];packageTotal+=tasks.length;for(const t of tasks){for(const leaf of t.deliverables||[]){total++;if(leaf.status==='Done')closed++}}if(filter.value!=='all'&&m.status!==filter.value)continue;const c=el('article',undefined,'card');c.id=m.id;c.tabIndex=-1;const top=el('div',undefined,'row');top.append(el('h2',(m.id||'')+' · '+(m.title||'Milestone')));top.append(el('span',m.status||'Unknown','badge'));c.append(top);if(m.foundation)c.append(el('p','Foundation: '+m.foundation,'detail'));if(m.goal)c.append(el('p','Goal: '+m.goal,'detail'));const issue=link(m.issueUrl,'Issue','issue');if(issue)c.append(issue);const ul=el('ul',undefined,'tasks');for(const t of tasks){const li=el('li');li.append(document.createTextNode((t.title||t.id||'Work package')+' — '+(t.status||'Unknown')));const a=link(t.url,'Issue','issue');if(a)li.append(a);const leaves=t.deliverables||[];if(leaves.length){const nested=el('ul');for(const leaf of leaves){const row=el('li');row.append(document.createTextNode((leaf.title||leaf.id)+' — '+(leaf.status||'Unknown')));const leafIssue=link(leaf.url,'Issue','issue');if(leafIssue)row.append(leafIssue);nested.append(row)}li.append(nested)}ul.append(li)}c.append(ul);if(Array.isArray(m.dependsOn)&&m.dependsOn.length){const dep=el('div',undefined,'deps');dep.append(document.createTextNode('Depends on: '));for(const id of m.dependsOn){const a=el('a',id.toUpperCase());a.href='#'+id;a.addEventListener('click',()=>{filter.value='all';render();document.getElementById(id)?.focus()});dep.append(a)}c.append(dep)}cards.append(c)}taskCount.textContent=closed+' of '+total+' delivery issues done · '+packageTotal+' work packages';if(!cards.childElementCount)cards.append(el('p','No milestones match this status.','notice'))};filter.addEventListener('change',render);render();})();
</script>
</body></html>
