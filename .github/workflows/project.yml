name: Project tracking
on:
  push:
    branches: [main]
  schedule:
    - cron: '11 * * * *'
  issues:
    types: [opened, edited, closed, reopened, labeled, unlabeled, deleted, transferred]
  workflow_dispatch:
    inputs:
      operation:
        description: Export progress or synchronize the reviewed milestone/work scope
        type: choice
        options: [snapshot, sync]
        default: snapshot
      apply:
        description: Apply metadata synchronization (otherwise preview)
        type: boolean
        default: false
permissions:
  contents: read
  issues: write
concurrency:
  group: project-tracking-${{ github.repository }}
  cancel-in-progress: false
jobs:
  tracking:
    if: github.repository == 'Jdiller-86/fuzion-frenzy-web-port' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Resolve immutable trusted main
        id: trusted
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          FUZION_TRACKING_SHA="$(gh api repos/Jdiller-86/fuzion-frenzy-web-port/commits/main --jq .sha)"
          [[ "$FUZION_TRACKING_SHA" =~ ^[0-9a-f]{40}$ ]]
          printf 'sha=%s\n' "$FUZION_TRACKING_SHA" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ steps.trusted.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
      - name: Verify tracking scope and acceptance rules
        run: |
          npm run check
          npm run test:project
      - name: Preview or apply reviewed metadata
        if: github.event_name != 'workflow_dispatch' || inputs.operation == 'sync'
        env:
          GH_TOKEN: ${{ github.token }}
          TRACKING_EVENT: ${{ github.event_name }}
          TRACKING_APPLY: ${{ inputs.apply }}
          TRACKING_SOURCE_SHA: ${{ steps.trusted.outputs.sha }}
        run: |
          if [ "$TRACKING_EVENT" != workflow_dispatch ] || [ "$TRACKING_APPLY" = true ]; then
            node tools/project.mjs sync --apply --source-commit "$TRACKING_SOURCE_SHA"
          else
            node tools/project.mjs sync --source-commit "$TRACKING_SOURCE_SHA"
          fi
      - name: Export current public tracking state
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          TRACKING_SOURCE_SHA: ${{ steps.trusted.outputs.sha }}
        run: node tools/project.mjs snapshot --source-commit "$TRACKING_SOURCE_SHA"
      - name: Build read-only offline progress view
        if: always()
        run: node tools/project.mjs render
      - name: Preview or synchronize the public GitHub Project
        env:
          GH_TOKEN: ${{ secrets.FUZION_GITHUB_MANAGEMENT_TOKEN }}
          TRACKING_EVENT: ${{ github.event_name }}
          TRACKING_APPLY: ${{ inputs.apply }}
          TRACKING_SOURCE_SHA: ${{ steps.trusted.outputs.sha }}
        run: |
          if [ "$TRACKING_EVENT" != workflow_dispatch ] || [ "$TRACKING_APPLY" = true ]; then
            node tools/project-board.mjs --apply
          else
            node tools/project-board.mjs
          fi
      - name: Retain public progress and synchronization receipts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: project-tracking-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/project.json
            artifacts/project-sync.json
            artifacts/project-board.json
            artifacts/progress/
          retention-days: 14
          if-no-files-found: warn
