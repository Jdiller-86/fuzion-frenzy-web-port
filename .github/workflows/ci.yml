name: Source checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  preparation:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm run test:workflow
      - run: npm run test:project
      - run: npm run test:formats
      - run: python -m py_compile tools/probe-browser-build.py tools/probe-native-recomp.py translator/prepare-title-recomp.py translator/recomp_memory_access.py
      - run: npm run test:evidence
      - run: npm run test:runtime
      - name: Check native component fixtures (Linux)
        if: runner.os == 'Linux'
        run: npm run test:native
      - run: npm run test:gameplay
      - run: npm run build
      - run: npm run check:environment
      - run: git diff --exit-code
