name: Windows local-game installer

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['windows-builder-v*']
    paths:
      - 'desktop/windows/**'
      - 'runtime/browser/sdk/SDK-NOTICE.txt'
      - '.github/workflows/windows-installer.yml'

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Install installer compiler
        shell: pwsh
        run: choco install nsis --version=3.11 --yes --no-progress
      - name: Compile launcher and installer
        shell: pwsh
        run: ./desktop/windows/Package-Installer.ps1
      - name: Upload downloadable installer
        uses: actions/upload-artifact@v4
        with:
          name: FuzionFrenzy-Windows-Installer
          path: |
            artifacts/windows/FuzionFrenzySetup.exe
            artifacts/windows/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
  release:
    needs: package
    if: startsWith(github.ref, 'refs/tags/windows-builder-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: FuzionFrenzy-Windows-Installer
          path: installer
      - name: Publish tagged installer preview
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          gh release create "$RELEASE_TAG" installer/FuzionFrenzySetup.exe installer/SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --verify-tag --prerelease --title "Fuzion Frenzy Windows Builder $RELEASE_TAG" --notes "Includes the native F1 settings panel, three local UI texture overrides, and geometry/descriptor fixes. Install the updated builder, then rebuild using your own compatible ISO/XISO or complete extracted folder. Original UI artwork and 4x previews are generated locally; no game files are included or uploaded. Play offers 4x preview, original pixels, or replacements off. Pause gameplay before opening F1. Existing saves and settings are retained. Native UI execution was reported by the local development session; this packaging job compiles the launcher and installer, not the original game."
