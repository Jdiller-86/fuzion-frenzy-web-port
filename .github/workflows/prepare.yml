name: Preparation checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  preparation:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm run test:formats
      - run: python -m py_compile tools/probe-browser-build.py tools/probe-native-recomp.py tools/prepare-title-recomp.py tools/recomp_memory_access.py
      - run: python tests/title_seed_test.py
      - run: python tests/recomp_memory_access_test.py
      - run: npm run test:runtime
      - name: Check triangle geometry (Linux)
        if: runner.os == 'Linux'
        run: |
          gcc -std=c11 -O2 -Wall -Wextra -Werror -ffp-contract=off tests/nv2a_triangle_test.c src/runtime/nv2a_triangle.c -lm -o "$RUNNER_TEMP/nv2a-triangle-check"
          "$RUNNER_TEMP/nv2a-triangle-check"
      - name: Check line geometry (Linux)
        if: runner.os == 'Linux'
        run: |
          gcc -std=c11 -O2 -Wall -Wextra -Werror -ffp-contract=off tests/nv2a_line_test.c src/runtime/nv2a_line.c -lm -o "$RUNNER_TEMP/nv2a-line-check"
          "$RUNNER_TEMP/nv2a-line-check"
      - name: Check quad geometry (Linux)
        if: runner.os == 'Linux'
        run: |
          gcc -std=c11 -O2 -Wall -Wextra -Werror -ffp-contract=off tests/nv2a_quad_test.c src/runtime/nv2a_quad.c -lm -o "$RUNNER_TEMP/nv2a-quad-check"
          "$RUNNER_TEMP/nv2a-quad-check"
      - name: Check interrupt-vector services (Linux)
        if: runner.os == 'Linux'
        run: |
          gcc -std=c11 -O2 -Wall -Wextra -Werror tests/interrupt_vector_test.c src/runtime/interrupt_vector.c src/runtime/virtual_memory.c -o "$RUNNER_TEMP/interrupt-vector-check"
          "$RUNNER_TEMP/interrupt-vector-check"
      - name: Check boot-thread contexts (Linux)
        if: runner.os == 'Linux'
        run: |
          gcc -std=c11 -O2 -Wall -Wextra -Werror tests/thread_bootstrap_test.c src/runtime/thread_bootstrap.c -o "$RUNNER_TEMP/thread-context-check"
          "$RUNNER_TEMP/thread-context-check"
      - name: Check kernel object initialization (Linux)
        if: runner.os == 'Linux'
        run: |
          gcc -std=c11 -O2 -Wall -Wextra -Werror tests/kernel_objects_test.c src/runtime/kernel_objects.c -o "$RUNNER_TEMP/kernel-objects-check"
          "$RUNNER_TEMP/kernel-objects-check"
      - name: Check local settings query (Linux)
        if: runner.os == 'Linux'
        run: |
          gcc -std=c11 -O2 -Wall -Wextra -Werror tests/local_settings_test.c src/runtime/local_settings.c -o "$RUNNER_TEMP/local-settings-check"
          "$RUNNER_TEMP/local-settings-check"
      - name: Check one-shot timer queues (Linux)
        if: runner.os == 'Linux'
        run: |
          gcc -std=c11 -O2 -Wall -Wextra -Werror tests/kernel_timers_test.c src/runtime/kernel_timers.c src/runtime/kernel_objects.c -o "$RUNNER_TEMP/kernel-timers-check"
          "$RUNNER_TEMP/kernel-timers-check"
      - name: Check DPC CPU contexts (Linux)
        if: runner.os == 'Linux'
        run: |
          gcc -std=c11 -O2 -Wall -Wextra -Werror tests/dpc_context_test.c src/runtime/dpc_context.c src/runtime/kernel_timers.c src/runtime/kernel_objects.c -o "$RUNNER_TEMP/dpc-context-check"
          "$RUNNER_TEMP/dpc-context-check"
      - name: Check guest memory ownership and access (Linux)
        if: runner.os == 'Linux'
        run: |
          python tools/recomp_memory_access.py "$RUNNER_TEMP/owned-memory.inc"
          gcc -std=c11 -O2 -Wall -Wextra -Werror tests/virtual_memory_test.c src/runtime/virtual_memory.c -o "$RUNNER_TEMP/virtual-memory-check"
          "$RUNNER_TEMP/virtual-memory-check"
          gcc -std=c11 -O2 -Wall -Wextra -Werror -I"$RUNNER_TEMP" tests/memory_access_test.c src/runtime/virtual_memory.c src/runtime/device_registers.c -o "$RUNNER_TEMP/memory-access-check"
          "$RUNNER_TEMP/memory-access-check"
      - run: npm run test:gameplay
      - name: Check local volume services (Linux)
        if: runner.os == 'Linux'
        run: |
          gcc -std=c11 -O2 -Wall -Wextra -Werror tests/local_volume_test.c src/runtime/local_volume.c src/runtime/virtual_memory.c -o "$RUNNER_TEMP/local-volume-check"
          "$RUNNER_TEMP/local-volume-check"
      - run: npm run build
      - name: Check local directory handles (Linux)
        if: runner.os == 'Linux'
        run: |
          gcc -std=c11 -O2 -Wall -Wextra -Werror tests/local_directories_test.c src/runtime/local_directories.c src/runtime/local_volume.c src/runtime/guest_strings.c src/runtime/virtual_memory.c -o "$RUNNER_TEMP/local-directories-check"
          "$RUNNER_TEMP/local-directories-check"
      - name: Check object namespace (Linux)
        if: runner.os == 'Linux'
        run: |
          gcc -std=c11 -O2 -Wall -Wextra -Werror tests/object_namespace_test.c src/runtime/object_namespace.c src/runtime/virtual_memory.c -o "$RUNNER_TEMP/object-namespace-check"
          "$RUNNER_TEMP/object-namespace-check"
      - name: Check retained file-target links (Linux)
        if: runner.os == 'Linux'
        run: |
          gcc -std=c11 -O2 -Wall -Wextra -Werror tests/file_namespace_test.c src/runtime/file_namespace.c src/runtime/object_namespace.c src/runtime/local_directories.c src/runtime/local_volume.c src/runtime/virtual_memory.c -o "$RUNNER_TEMP/file-namespace-check"
          "$RUNNER_TEMP/file-namespace-check"
      - name: Check owned regular file create/query/write (Linux)
        if: runner.os == 'Linux'
        run: |
          gcc -std=c11 -O2 -Wall -Wextra -Werror tests/local_files_test.c src/runtime/local_files.c src/runtime/local_directories.c src/runtime/local_volume.c src/runtime/virtual_memory.c -o "$RUNNER_TEMP/local-files-check"
          "$RUNNER_TEMP/local-files-check"
      - name: Check owned XBE section residency (Linux)
        if: runner.os == 'Linux'
        run: |
          gcc -std=c11 -O2 -Wall -Wextra -Werror tests/image_sections_test.c src/runtime/image_sections.c src/runtime/virtual_memory.c -o "$RUNNER_TEMP/image-sections-check"
          "$RUNNER_TEMP/image-sections-check"
      - name: Check explicit console settings and memory permissions (Linux)
        if: runner.os == 'Linux'
        run: |
          gcc -std=c11 -O2 -Wall -Wextra -Werror tests/console_settings_test.c src/runtime/console_settings.c src/runtime/virtual_memory.c -o "$RUNNER_TEMP/console-settings-check"
          "$RUNNER_TEMP/console-settings-check"
      - name: Check owned sparse disk device (Linux)
        if: runner.os == 'Linux'
        run: |
          gcc -std=c11 -O2 -Wall -Wextra -Werror tests/local_disk_test.c src/runtime/local_disk.c src/runtime/virtual_memory.c -o "$RUNNER_TEMP/local-disk-check"
          "$RUNNER_TEMP/local-disk-check"
      - name: Check owned backed FATX roots (Linux)
        if: runner.os == 'Linux'
        run: |
          gcc -std=c11 -O2 -Wall -Wextra -Werror tests/fatx_volume_test.c src/runtime/fatx_volume.c src/runtime/local_disk.c src/runtime/object_namespace.c src/runtime/file_namespace.c src/runtime/local_volume.c src/runtime/local_directories.c src/runtime/virtual_memory.c -o "$RUNNER_TEMP/fatx-root-check"
          "$RUNNER_TEMP/fatx-root-check"
      - name: Check owned memory statistics (Linux)
        if: runner.os == 'Linux'
        run: |
          gcc -std=c11 -O2 -Wall -Wextra -Werror tests/memory_statistics_test.c src/runtime/memory_statistics.c src/runtime/virtual_memory.c -o "$RUNNER_TEMP/memory-statistics-check"
          "$RUNNER_TEMP/memory-statistics-check"
      - name: Check owned synthetic register storage (Linux)
        if: runner.os == 'Linux'
        run: |
          gcc -std=c11 -O2 -Wall -Wextra -Werror tests/device_registers_test.c src/runtime/device_registers.c -o "$RUNNER_TEMP/device-registers-check"
          "$RUNNER_TEMP/device-registers-check"
      - name: Check GPU instance claim (Linux)
        if: runner.os == 'Linux'
        run: |
          gcc -std=c11 -O2 -Wall -Wextra -Werror tests/gpu_instance_test.c src/runtime/gpu_instance.c src/runtime/virtual_memory.c -o "$RUNNER_TEMP/gpu-instance-check"
          "$RUNNER_TEMP/gpu-instance-check"
      - name: Check port-output log (Linux)
        if: runner.os == 'Linux'
        run: |
          gcc -std=c11 -O2 -Wall -Wextra -Werror tests/port_io_test.c src/runtime/port_io.c -o "$RUNNER_TEMP/port-io-check"
          "$RUNNER_TEMP/port-io-check"
      - run: npm run check:environment
      - run: git diff --exit-code
