name: Preparation checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  preparation:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm run test:formats
      - run: python -m py_compile tools/probe-browser-build.py tools/probe-native-recomp.py tools/prepare-title-recomp.py
      - run: python tests/title_seed_test.py
      - run: npm run test:runtime
      - name: Check triangle geometry (Linux)
        if: runner.os == 'Linux'
        run: |
          gcc -std=c11 -O2 -Wall -Wextra -Werror -ffp-contract=off tests/nv2a_triangle_test.c src/runtime/nv2a_triangle.c -lm -o "$RUNNER_TEMP/nv2a-triangle-check"
          "$RUNNER_TEMP/nv2a-triangle-check"
      - name: Check boot-thread contexts (Linux)
        if: runner.os == 'Linux'
        run: |
          gcc -std=c11 -O2 -Wall -Wextra -Werror tests/thread_bootstrap_test.c src/runtime/thread_bootstrap.c -o "$RUNNER_TEMP/thread-context-check"
          "$RUNNER_TEMP/thread-context-check"
      - run: npm run test:gameplay
      - run: npm run build
      - run: npm run check:environment
      - run: git diff --exit-code
